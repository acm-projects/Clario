services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    container_name: piston_api
    privileged: true
    restart: unless-stopped
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_OUTPUT_MAX_SIZE: "16384"
      PISTON_MAX_PROCESS_COUNT: "64"
      PISTON_MAX_CONCURRENT_JOBS: "4"
      PISTON_LIMIT_OVERRIDES: '{"python":{"max_process_count":16,"max_open_files":64,"max_file_size":1048576,"run_memory_limit":134217728,"compile_memory_limit":268435456}}'
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston_data:/piston

volumes:
  piston_data:
